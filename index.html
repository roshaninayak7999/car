
<!DOCTYPE html>
<html>
<head>
<title>Ultimate Car Racing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#111;color:white;
 font-family:Arial;text-align:center;
}
h1{color:#00ff99}
#score{font-size:24px;color:yellow}
#game{
 width:320px;height:520px;
 margin:auto;background:#444;
 border-left:8px solid white;
 border-right:8px solid white;
 position:relative;overflow:hidden;
}
.line{
 position:absolute;width:8px;height:70px;
 background:white;left:148px;
}
#player,#enemy{
 position:absolute;font-size:43px;
}
#player{bottom:15px;left:130px}
#enemy{top:-70px;left:50px}
.controls button,.start{
 padding:14px 25px;margin:8px;
 font-size:23px;border:0;
 border-radius:12px;background:#00ff99;
}
</style>
</head>
<body>

<h1>🏎️ ULTIMATE RACING</h1>
<div id="score">Score: 0</div>

<div id="game">
 <div class="line" style="top:0"></div>
 <div class="line" style="top:180px"></div>
 <div class="line" style="top:360px"></div>
 <div id="player">🏎️</div>
 <div id="enemy">🚙</div>
</div>

<div class="controls">
 <button onclick="move(-1)">⬅️</button>
 <button onclick="move(1)">➡️</button>
</div>

<button class="start" onclick="startGame()">START GAME</button>
<p id="message">Press START to play!</p>

<script>
const player=document.getElementById("player");
const enemy=document.getElementById("enemy");
const scoreBox=document.getElementById("score");
const message=document.getElementById("message");

let x=130,y=-70,score=0,speed=5;
let playing=false,frame;

function move(d){
 if(!playing)return;
 x=Math.max(5,Math.min(260,x+d*35));
 player.style.left=x+"px";
}

function startGame(){
 cancelAnimationFrame(frame);
 x=130;y=-70;score=0;speed=5;
 playing=true;
 player.style.left=x+"px";
 enemy.style.top=y+"px";
 enemy.style.left="50px";
 scoreBox.innerText="Score: 0";
 message.innerText="Race started! Good luck!";
 loop();
}

function loop(){
 if(!playing)return;

 y+=speed;
 enemy.style.top=y+"px";

 if(y>530){
  y=-70;
  enemy.style.left=Math.floor(Math.random()*250)+"px";
  score++;
  speed=Math.min(12,5+score*0.2);
  scoreBox.innerText="Score: "+score;
 }

 let ex=parseInt(enemy.style.left)||0;

 if(y>400 && y<500 && Math.abs(x-ex)<38){
  playing=false;
  message.innerText="💥 GAME OVER! Score: "+score;
  return;
 }
 frame=requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);
});
</script>
</body>
</html>
